---
# tasks file for consul_server
- name: Install consul
  apt:
    name: consul
    state: present
    update_cache: yes

- name: Create data directory
  file:
    path: "{{ consul_data_dir }}"
    state: directory
    owner: consul
    group: consul

- name: Deploy Consul server config
  template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: '0640'
  notify: restart consul

- name: Enable and start consul
  systemd:
    name: consul
    enabled: yes
    state: started