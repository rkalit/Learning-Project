---
# tasks file for load_balancer
- name: Install consul, consul-template and nginx
  apt:
    name: [consul, consul-template, nginx]
    state: present
    update_cache: yes

- name: Create data directory
  file:
    path: "{{ consul_data_dir }}"
    state: directory
    owner: consul
    gorup: consul

- name: Create consul-template config directory
  file:
    path: /etc/consul-template.d
    state: directory

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy consul agent config
  template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: '0640'
  notify: restart consul

- name: Deploy nginx consul-template source
  template:
    src: load-balancer.conf.ctmpl.j2
    dest: /etc/consul-template.d/load-balancer.conf.ctmpl
  notify: restart consul-template

- name: Deploy consul-template systemd unit
  template:
    src: consul-template.service.j2
    dest: /etc/systemd/system/consul-template.service
  notify:
    - reload systemd
    - restart consul-template

- name: Flush handlers so systemd knows the new unit
  meta: flush_handlers

- name: Enable and start consul
  systemd:
    name: consul
    enabled: yes
    state: started

- name: Enable and start nginx
  systemd:
    name: nginx
    enabled: yes
    state: started

- name: Enable and start consul-template
  systemd:
    name: consul-template
    enabled: yes
    state: started